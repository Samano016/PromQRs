<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Stream Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #00d1b2; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--dark); color: white; }
        .hidden { display: none; }
        .btn { background: var(--primary); color: black; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Vista Estudiante */
        #student-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* Vista Admin y Proyector */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .admin-controls { margin-top: 10px; display: flex; justify-content: space-around; }
        
        #qr-container { background: white; padding: 20px; display: inline-block; margin: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="student-view">
        <h2>Subir foto al evento</h2>
        <input type="file" id="fileItem" accept="image/*" style="display:none">
        <button class="btn" onclick="document.getElementById('fileItem').click()">📷 SELECCIONAR FOTO</button>
        <p id="status"></p>
    </div>

    <div id="admin-view" class="hidden">
        <h1>Panel de Control</h1>
        <div id="qr-container"></div>
        <p>Escanea para subir fotos o abre <b>?view=proyector</b> para mostrar.</p>
        <hr>
        <h3>Fotos Pendientes de Moderación</h3>
        <div id="pending-grid" class="grid"></div>
    </div>

    <div id="projector-view" class="hidden">
        <h1>Galería en Vivo</h1>
        <div id="approved-grid" class="grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, updateDoc, doc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            appId: "TU_ID"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        // --- ENRUTAMIENTO SIMPLE ---
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('view'); // admin, proyector o null (estudiante)

        if (mode === 'admin') {
            document.getElementById('student-view').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
            initAdmin();
        } else if (mode === 'proyector') {
            document.getElementById('student-view').classList.add('hidden');
            document.getElementById('projector-view').classList.remove('hidden');
            initProyector();
        }

        // --- LÓGICA ESTUDIANTE ---
        document.getElementById('fileItem').onchange = async (e) => {
            const file = e.target.files[0];
            const status = document.getElementById('status');
            if (!file) return;

            status.innerText = "Subiendo...";
            const storageRef = ref(storage, `raw/${Date.now()}_${file.name}`);
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef);

            await addDoc(collection(db, "photos"), {
                url: url,
                status: 'pending',
                timestamp: Date.now()
            });
            status.innerText = "¡Enviada! Espera a que el moderador la apruebe.";
        };

        // --- LÓGICA ADMIN (MODERACIÓN) ---
        function initAdmin() {
            // Generar QR de la URL actual (sin el ?view=admin)
            new QRCode(document.getElementById("qr-container"), window.location.href.split('?')[0]);

            const q = query(collection(db, "photos"), where("status", "==", "pending"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('pending-grid');
                container.innerHTML = '';
                snapshot.forEach((snap) => {
                    const data = snap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${data.url}">
                        <div class="admin-controls">
                            <button class="btn" style="background:#2ecc71" onclick="approvePhoto('${snap.id}')">✅</button>
                            <button class="btn" style="background:#e74c3c" onclick="deletePhoto('${snap.id}')">🗑️</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        // --- LÓGICA PROYECTOR ---
        function initProyector() {
            const q = query(collection(db, "photos"), where("status", "==", "approved"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('approved-grid');
                container.innerHTML = '';
                snapshot.forEach((snap) => {
                    const img = document.createElement('img');
                    img.src = snap.data().url;
                    img.style.width = "300px"; // Ajusta según tu proyector
                    img.style.margin = "10px";
                    container.appendChild(img);
                });
            });
        }

        // Funciones globales para botones
        window.approvePhoto = (id) => updateDoc(doc(db, "photos", id), { status: 'approved' });
        window.deletePhoto = (id) => deleteDoc(doc(db, "photos", id));

    </script>
</body>
</html>
